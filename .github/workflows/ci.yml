name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, build, committed dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Committed dist matches the build
        run: |
          changes="$(git status --porcelain -- dist)"
          if [ -n "$changes" ]; then
            echo "dist/ differs from a fresh build. Run npm run build and commit dist/."
            echo "$changes"
            git diff --stat -- dist
            exit 1
          fi
